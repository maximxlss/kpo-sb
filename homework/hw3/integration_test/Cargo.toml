[package]
name = "integration_test"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "~1.0"
reqwest = { version = "~0.12", features = ["json", "multipart", "rustls-tls"] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
tokio = { version = "~1.48", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "~1.19", features = ["serde", "v4"] }
