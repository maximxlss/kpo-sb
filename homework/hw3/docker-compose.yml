name: kpo_antiplag_default
services:
  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=kpo_antiplag_db
      - PGUSER=postgres
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 3s
      timeout: 3s
      start_period: 1s
      retries: 3

  db_init:
    image: postgres:latest
    environment:
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=kpo_antiplag_db
      - PGHOST=db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db_init.sql:/init.sql
    command: ["psql", "-f", "/init.sql"]  
  
  file_storage:
    build:
      context: .
      target: file_storage
    ports:
      - "18081:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db/kpo_antiplag_db
      - FILE_STORAGE_PASSWORD
      - ACCESS_PASSWORD=${FILE_STORAGE_PASSWORD}
      - RUST_LOG
    volumes:
      - file_storage_data:/app/storage
    restart: always
    depends_on:
      db_init:
        condition: service_completed_successfully

  work_analyzer:
    build:
      context: .
      target: work_analyzer
    ports:
      - "18082:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db/kpo_antiplag_db
      - FILE_STORAGE_PASSWORD
      - RUST_LOG
    restart: always
    depends_on:
      db_init:
        condition: service_completed_successfully
  
  work_main_api:
    build:
      context: .
      target: work_main_api
    ports:
      - "18080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db/kpo_antiplag_db
      - FILE_STORAGE_PASSWORD
      - RUST_LOG
    restart: always
    depends_on:
      db_init:
        condition: service_completed_successfully
    
  router:
    image: nginx:latest
    ports:
      - "80:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - file_storage
      - work_main_api

volumes:
  db_data:
  file_storage_data:
