events {
  worker_connections  1024;
}

http {
  upstream orders_service {
    server orders-service:8081 max_fails=0;
  }

  upstream payments_service {
    server payments-service:8082 max_fails=0;
  }

  server {
    listen 8080;

    location /health {
      return 200 "ok";
    }

    location /orders {
      proxy_pass http://orders_service;
    }

    location /accounts {
      proxy_pass http://payments_service;
    }
  }
}
